# Owner policy, set once (Devank owns this file). See docs/design.md, "Rules engine, decision gate and approvals".
auto_dispute_limit_usd: 5000        # disputes above this need the owner before filing
approval_over_usd: 1000            # credit memos above this wait for the admin's yes (never an agent's)
auto_post_limit: null              # fair-charge memos up to this post without asking; null: always ask (the admin can
                                    # set one per account by ticking "post automatically" when approving a memo)
confidence_floor: 0.90              # Investigator confidence below this goes to Ask
match_tolerance_usd: 1.00           # a delta within this counts as a match
rule_match_similarity: 0.85         # Moss similarity needed to apply a saved rule (tune on the eval)
reminder_after_minutes: 15          # busy approver reminder
default_dispute_days: 90            # dispute window when the account's terms/ops-terms.csv states no dispute_window_days
manual_minutes_per_charge: null     # minutes a person spends checking one charge by hand; null: no comparison shown
discretion_words:
  - "may"
  - "at its discretion"
  - "reasonable"
  - "sole judgment"
# Each account's own list is approved_senders in data/accounts/<id>/account.yaml, and that is what documents use;
# this one (Peak Bar's) is what the engine's Policy and the eval harness read.
approved_amendment_senders:          # only these (or a document signed by both parties) can change a deal
  - "dana@peakbar.example"           # owner (fictional)
  - "jordan@peakbar-broker.example"  # broker (fictional)
auto_send: false                    # true: a dispute within auto_dispute_limit_usd is emailed without the admin's
                                    # review (api/dispute_email.py); false: every dispute waits for "Review and send"
question_risk:                      # how much a question to the admin matters (api/engine/question_risk.py)
  high_usd: 1000                    # high at or above this amount at stake,
  high_pct_of_payment: 5            # or at or above this % of the payment
  medium_usd: 250                   # medium at or above this; low below
  deadline_days: 14                 # a dispute window this close raises the level a step and makes it a deadline
dispute_window_warn_days: 14        # a dispute window closing this soon puts "file by <date>" on the decision
