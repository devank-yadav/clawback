# Fee-schedule wiring for this account (the layout of api/fee_accounts.py). account.yaml keeps the AccountConfig shape.
# The governing deal: Walmart's Supplier Agreement, real and unedited, read before account.yaml's deal_docs.
contract: {id: walmart-supplier-agreement-2013, path: contracts/walmart-supplier-agreement-2013.txt, date: 2013-04-18}
# Charge code -> the fee as the agreement names it (codes SA, NW and DM are the agreement's own allowance codes).
codes:
  SA: New Store/Club Discount
  NW: New Distribution Center
  DM: Defective/Returned Mdse. Allowance
  RJ: Rejection
  FN: Assessment of monetary fines
  RT: Returned merchandise
  IN: Interest
policy_changes: []
# The day the remittance arrived and any dispute would be filed; the invoice date.
as_of: 2026-04-10
invoice_date: 2026-03-31
